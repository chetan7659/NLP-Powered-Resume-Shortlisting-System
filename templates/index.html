<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Shortlister</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl font-bold text-center mb-8 text-blue-600">AI Resume Shortlister 🚀</h1>

            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                <form id="evaluationForm" enctype="multipart/form-data">
                    <div class="grid md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Job Description *
                            </label>
                            <textarea
                                id="jd_text"
                                name="jd_text"
                                rows="10"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="Paste the Job Description here..."
                                required
                            ></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Required Skills *
                            </label>
                            <input
                                type="text"
                                id="skills_text"
                                name="skills_text"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
                                placeholder="Python, SQL, Project Management..."
                                required
                            />
                            <p class="text-sm text-gray-500 mb-4">These will be merged with skills extracted from the JD.</p>

                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Upload Resumes *
                            </label>
                            <input
                                type="file"
                                id="files"
                                name="files"
                                multiple
                                accept=".pdf,.docx"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                required
                            />
                            <p class="text-sm text-gray-500 mt-1">Upload PDF or DOCX files</p>
                        </div>
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-3 px-6 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50"
                        id="submitBtn"
                    >
                        Evaluate Candidates
                    </button>
                </form>
            </div>

            <!-- Loading indicator -->
            <div id="loading" class="hidden bg-white rounded-lg shadow-md p-6 mb-8">
                <div class="flex items-center justify-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                    <span class="ml-2 text-gray-600">Evaluating candidates...</span>
                </div>
            </div>

            <!-- Results -->
            <div id="results" class="hidden bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">Results</h2>
                <div id="resultsList"></div>
            </div>

            <!-- Error message -->
            <div id="error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-8">
                <span id="errorMessage"></span>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('evaluationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('jd_text', document.getElementById('jd_text').value);
            formData.append('skills_text', document.getElementById('skills_text').value);

            const files = document.getElementById('files').files;
            for (let file of files) {
                formData.append('files', file);
            }

            // Show loading
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('submitBtn').disabled = true;

            try {
                const response = await fetch('/api/evaluate', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    displayResults(data.results);
                } else {
                    showError(data.detail || 'An error occurred');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('submitBtn').disabled = false;
            }
        });

        function displayResults(results) {
            const resultsDiv = document.getElementById('resultsList');
            resultsDiv.innerHTML = '';

            results.forEach((result, index) => {
                const resultCard = document.createElement('div');
                resultCard.className = 'bg-gray-50 rounded-lg p-4 mb-4';
                resultCard.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-lg font-semibold text-gray-800">${result.name}</h3>
                        <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">
                            Score: ${result.score}/100
                        </span>
                    </div>
                    <div class="grid md:grid-cols-2 gap-4 mb-3">
                        <div>
                            <span class="text-sm text-gray-600">Skills Match:</span>
                            <span class="font-medium">${result.match_ratio}</span>
                        </div>
                        <div>
                            <span class="text-sm text-gray-600">Experience:</span>
                            <span class="font-medium">${result.experience}</span>
                        </div>
                    </div>
                    <div class="border-t pt-3">
                        <h4 class="text-sm font-medium text-gray-700 mb-2">Explanation:</h4>
                        <p class="text-sm text-gray-600 whitespace-pre-line">${result.explanation}</p>
                    </div>
                `;
                resultsDiv.appendChild(resultCard);
            });

            document.getElementById('results').classList.remove('hidden');
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('error').classList.remove('hidden');
        }
    </script>
</body>
</html>
